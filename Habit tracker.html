<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해빗 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column of record cards, like a pocket logbook; a fixed-feel bottom bar switches daily / weekly / monthly. */
:root {
  --bg: #edf1ef;
  --surface: #ffffff;
  --ink: #17211f;
  --muted: #5b6966;
  --line: #d3dbd8;
  --accent: #1c6b59;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe6;
  --coffee: #8a5a2b;
  --warn: #b4472e;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615;
    --surface: #1a2120;
    --ink: #e5ebe9;
    --muted: #94a29e;
    --line: #2c3634;
    --accent: #62c4a9;
    --accent-ink: #0c1513;
    --accent-soft: #1f3530;
    --coffee: #d3a26c;
    --warn: #ef8a6f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615;
  --surface: #1a2120;
  --ink: #e5ebe9;
  --muted: #94a29e;
  --line: #2c3634;
  --accent: #62c4a9;
  --accent-ink: #0c1513;
  --accent-soft: #1f3530;
  --coffee: #d3a26c;
  --warn: #ef8a6f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app {
  max-width: 560px;
  min-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
main { flex: 1; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Header */
.head { display: flex; flex-direction: column; gap: 10px; }
.head-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.view-name { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--accent); }
.status { font-size: 12px; color: var(--muted); }
.status.err { color: var(--warn); }
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar h1 {
  flex: 1; margin: 0; text-align: center;
  font-size: 20px; font-weight: 600; text-wrap: balance;
}
.icon-btn {
  width: 44px; height: 44px; flex: none;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); font-size: 18px; line-height: 1;
}
.today-btn {
  align-self: center;
  border: 0; background: none; padding: 2px 8px;
  font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px;
}
.today-btn[hidden] { display: none; }
.notice {
  border: 1px solid var(--line); border-left: 4px solid var(--warn);
  background: var(--surface); border-radius: 10px; padding: 10px 12px;
  font-size: 13px; color: var(--muted);
  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.notice[hidden] { display: none; }
.notice button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.card h2 {
  margin: 0; font-size: 15px; font-weight: 600;
  display: flex; align-items: baseline; gap: 8px;
}
.card h2 .h2-total { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); }
.card h2 .idx { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.row + .row { border-top: 1px solid var(--line); padding-top: 12px; }
.row-label { display: flex; flex-direction: column; min-width: 0; }
.row-label small { color: var(--muted); font-size: 12px; }

/* Stepper */
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 44px; height: 44px; flex: none;
  border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); font-size: 22px; line-height: 1;
}
.stepper button.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output {
  min-width: 108px; text-align: center;
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 22px; font-weight: 600;
}
.stepper output span { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .lab { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="time"] {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* O / X segmented */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.seg button {
  min-width: 56px; height: 44px; border: 0; background: none;
  font-family: var(--font-num); font-weight: 600; font-size: 17px; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button.x[aria-pressed="true"] { background: var(--muted); color: var(--surface); }
#ot-hours-row[hidden] { display: none; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.tile .v span { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.tile .s { font-size: 12px; color: var(--muted); }

/* Weekly table */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 500; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--font-body); }
tr.total td { font-weight: 600; border-bottom: 0; border-top: 2px solid var(--ink); }
td .zero { color: var(--line); }
.daylink {
  border: 0; background: none; padding: 0; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px;
}
tr.is-today .daylink { color: var(--accent); font-weight: 600; }
.yes { color: var(--accent); font-weight: 600; }

.meals { display: flex; flex-direction: column; gap: 12px; }
.meal-day { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.meal-day b { font-weight: 600; font-size: 13px; color: var(--muted); }
.meal-day span i { font-style: normal; color: var(--muted); margin-right: 6px; font-size: 12px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* Month calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cal .cell {
  aspect-ratio: 1 / 1.15; min-width: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
}
.cal .cell.blank { border-color: transparent; background: none; }
.cal .cell.has { background: var(--surface); }
.cal .cell.is-today { border-color: var(--accent); border-width: 2px; }
.cal .d { font-family: var(--font-num); font-size: 13px; font-weight: 500; }
.cal .cf { font-family: var(--font-num); font-size: 11px; color: var(--coffee); font-weight: 600; min-height: 14px; }
.cal .dots { display: flex; gap: 3px; min-height: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.ex { background: var(--accent); }
.dot.p25 { background: var(--ink); }
.dot.ot { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .cfk { font-family: var(--font-num); color: var(--coffee); font-weight: 600; }

/* Bottom nav */
.nav {
  position: sticky; bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 10px 16px 14px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.nav a {
  display: flex; align-items: center; justify-content: center;
  min-height: 46px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px; text-align: center;
}
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

section[hidden] { display: none; }
section { display: flex; flex-direction: column; gap: 16px; }
.loading { opacity: .5; pointer-events: none; }
@media (max-width: 380px) {
  .stepper output { min-width: 84px; font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .stepper button, .seg button, .nav a { transition: background-color .12s, color .12s; }
}
</style>
</head>
<body>
<div class="app">
<main>
  <header class="head">
    <div class="head-top">
      <span class="view-name" id="view-name">일일 기록</span>
      <span class="status" id="status" role="status">불러오는 중</span>
    </div>
    <div class="datebar">
      <button class="icon-btn" id="prev" type="button" aria-label="이전">&#8249;</button>
      <h1 id="title">&nbsp;</h1>
      <button class="icon-btn" id="next" type="button" aria-label="다음">&#8250;</button>
    </div>
    <button class="today-btn" id="go-today" type="button" hidden>오늘로 이동</button>
    <div class="notice" id="notice" hidden><span id="notice-text"></span><button type="button" id="retry" hidden>다시 시도</button></div>
  </header>

  <!-- DAILY -->
  <section id="view-daily" class="loading">
    <div class="card">
      <h2><span class="idx">1</span>음료수<span class="h2-total" id="coffee-total"></span></h2>
      <div class="row">
        <div class="row-label">커피<small>카페인</small></div>
        <div class="stepper" data-key="coffee" data-step="1" data-unit="잔"></div>
      </div>
      <div class="row">
        <div class="row-label">디카페인 커피</div>
        <div class="stepper" data-key="decaf" data-step="1" data-unit="잔"></div>
      </div>
      <div class="row">
        <div class="row-label">물</div>
        <div class="stepper" data-key="water" data-step="1" data-unit="잔"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="idx">2</span>운동량</h2>
      <div class="row">
        <div class="row-label">계단 오르기</div>
        <div class="stepper" data-key="stairs" data-step="1" data-unit="층"></div>
      </div>
      <div class="row">
        <div class="row-label">걷기<small>500보 단위</small></div>
        <div class="stepper" data-key="steps" data-step="500" data-unit="보"></div>
      </div>
      <div class="row">
        <div class="row-label">뛰기<small>0.5km 단위</small></div>
        <div class="stepper" data-key="runKm" data-step="0.5" data-unit="km"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="idx">3</span>식사</h2>
      <div class="field"><label for="meal-breakfast">아침</label><input type="text" id="meal-breakfast" data-meal="breakfast" autocomplete="off" maxlength="200"></div>
      <div class="field"><label for="meal-lunch">점심</label><input type="text" id="meal-lunch" data-meal="lunch" autocomplete="off" maxlength="200"></div>
      <div class="field"><label for="meal-dinner">저녁</label><input type="text" id="meal-dinner" data-meal="dinner" autocomplete="off" maxlength="200"></div>
      <div class="field"><label for="meal-snack">간식</label><input type="text" id="meal-snack" data-meal="snack" autocomplete="off" maxlength="200"></div>
    </div>

    <div class="card">
      <h2><span class="idx">4</span>Perfect25 수업</h2>
      <div class="row">
        <div class="row-label">오늘 수업 여부</div>
        <div class="seg" id="seg-p25" role="group" aria-label="Perfect25 수업 여부">
          <button type="button" class="x" id="p25-x" data-val="0">X</button>
          <button type="button" id="p25-o" data-val="1">O</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="idx">5</span>야근</h2>
      <div class="row">
        <div class="row-label">오늘 야근 여부</div>
        <div class="seg" id="seg-ot" role="group" aria-label="야근 여부">
          <button type="button" class="x" id="ot-x" data-val="0">X</button>
          <button type="button" id="ot-o" data-val="1">O</button>
        </div>
      </div>
      <div class="row" id="ot-hours-row" hidden>
        <div class="row-label">야근 시간<small>0.5시간 단위</small></div>
        <div class="stepper" data-key="overtimeHours" data-step="0.5" data-unit="시간"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="idx">6</span>수면</h2>
      <div class="grid2">
        <div class="field"><label for="wake">일어난 시간</label><input type="time" id="wake"></div>
        <div class="field"><label for="sleep">잠든 시간</label><input type="time" id="sleep"></div>
      </div>
    </div>
  </section>

  <!-- WEEKLY -->
  <section id="view-weekly" hidden>
    <div class="tiles" id="week-tiles"></div>
    <div class="card">
      <h2>요일별 기록</h2>
      <div class="scroll" id="week-table"></div>
    </div>
    <div class="card">
      <h2>식사 기록</h2>
      <div class="meals" id="week-meals"></div>
    </div>
  </section>

  <!-- MONTHLY -->
  <section id="view-monthly" hidden>
    <div class="tiles" id="month-tiles"></div>
    <div class="card">
      <h2>달력</h2>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><b class="cfk">2+1</b>카페인+디카페인 잔 수</span>
        <span><i class="dot ex"></i>운동</span>
        <span><i class="dot p25"></i>Perfect25</span>
        <span><i class="dot ot"></i>야근</span>
      </div>
      <p class="empty">날짜를 누르면 그날의 일일 기록으로 이동함.</p>
    </div>
  </section>
</main>

<nav class="nav" aria-label="보기 전환">
  <a href="#daily" data-view="daily">일일 기록</a>
  <a href="#weekly" data-view="weekly">주간 모아보기</a>
  <a href="#monthly" data-view="monthly">월간 모아보기</a>
</nav>
</div>

<script>
(function () {
  "use strict";
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var MEALS = [["breakfast", "아침"], ["lunch", "점심"], ["dinner", "저녁"], ["snack", "간식"]];
  var VIEWS = { daily: "일일 기록", weekly: "주간 모아보기", monthly: "월간 모아보기" };

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function ymOf(k) { return k.slice(0, 7); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString("ko-KR"); }

  function blank(k) {
    return { date: k, coffee: 0, decaf: 0, water: 0, stairs: 0, steps: 0, runKm: 0,
      meals: { breakfast: "", lunch: "", dinner: "", snack: "" },
      perfect25: false, overtime: false, overtimeHours: 0, wake: "", sleep: "" };
  }
  function normalize(k, raw) {
    var d = blank(k); raw = raw || {};
    ["coffee", "decaf", "water", "stairs", "steps", "runKm", "overtimeHours"].forEach(function (f) {
      var v = Number(raw[f]); if (isFinite(v) && v > 0) d[f] = v;
    });
    d.perfect25 = !!raw.perfect25; d.overtime = !!raw.overtime;
    if (typeof raw.wake === "string") d.wake = raw.wake;
    if (typeof raw.sleep === "string") d.sleep = raw.sleep;
    if (raw.meals && typeof raw.meals === "object") MEALS.forEach(function (m) {
      if (typeof raw.meals[m[0]] === "string") d.meals[m[0]] = raw.meals[m[0]];
    });
    return d;
  }

  /* ---------- state ---------- */
  var today = keyOf(new Date());
  var cur = today;
  var days = {};            // date key -> day object (only days that were loaded or edited)
  var loadedMonths = {};    // "YYYY-MM" -> true
  var col = null;           // db collection for this viewer, or null in local mode
  var local = false;
  var ready = false;
  var saveState = {};       // date -> {timer, writing, dirty}
  var pendingCount = 0;

  function getDay(k) { return days[k] || blank(k); }
  function setStatus(text, err) { var s = $("status"); s.textContent = text; s.classList.toggle("err", !!err); }
  function showNotice(text, retry) {
    $("notice-text").textContent = text; $("retry").hidden = !retry; $("notice").hidden = false;
  }

  /* ---------- storage ---------- */
  function localLoad() {
    try {
      var raw = JSON.parse(localStorage.getItem("habit-days") || "{}");
      Object.keys(raw).forEach(function (k) { days[k] = normalize(k, raw[k]); });
    } catch (e) {}
  }
  function localSave() {
    try { localStorage.setItem("habit-days", JSON.stringify(days)); return true; } catch (e) { return false; }
  }

  function timeout(ms) { return new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, ms); }); }

  function ensureMonths(yms) {
    if (local) return Promise.resolve();
    var need = yms.filter(function (ym, i) { return !loadedMonths[ym] && yms.indexOf(ym) === i; });
    if (!need.length) return Promise.resolve();
    return Promise.all(need.map(function (ym) {
      var q = col.where("date", ">=", ym + "-01").where("date", "<=", ym + "-31");
      return Promise.race([q.get(), timeout(10000)]).then(function (snap) {
        snap.docs.forEach(function (doc) {
          var st = saveState[doc.id];
          if (st && (st.timer || st.writing || st.dirty)) return; // keep unsaved local edits
          days[doc.id] = normalize(doc.id, doc.data());
        });
        loadedMonths[ym] = true;
      });
    }));
  }

  function scheduleSave(k) {
    var st = saveState[k] || (saveState[k] = { timer: null, writing: false, dirty: false });
    if (st.timer) clearTimeout(st.timer); else pendingCount++;
    setStatus("저장 중");
    st.timer = setTimeout(function () { st.timer = null; pendingCount--; flush(k); }, 700);
  }
  function flush(k) {
    var st = saveState[k];
    if (local) {
      setStatus(localSave() ? "이 기기에 저장됨" : "저장 실패", false);
      return;
    }
    if (st.writing) { st.dirty = true; return; }
    st.writing = true;
    var body = JSON.parse(JSON.stringify(days[k]));
    col.doc(k).set(body).then(function () {
      st.writing = false;
      if (st.dirty) { st.dirty = false; flush(k); return; }
      if (!pendingCount) setStatus("저장됨");
    }, function (e) {
      st.writing = false; st.dirty = false;
      setStatus("저장 실패", true);
      showNotice(e && e.code === "invalid_argument"
        ? "이 계정으로는 기록을 저장할 수 없음. 페이지 소유자 계정으로 열었는지 확인 필요."
        : "방금 변경한 내용이 저장되지 않았음. 연결을 확인한 뒤 값을 다시 바꾸면 재저장됨.", false);
    });
  }

  function mutate(k, fn) {
    if (!ready) return;
    var d = days[k] || (days[k] = blank(k));
    fn(d);
    scheduleSave(k);
  }

  /* ---------- daily view ---------- */
  var steppers = {};
  Array.prototype.forEach.call(document.querySelectorAll(".stepper"), function (el) {
    var key = el.dataset.key, step = Number(el.dataset.step), unit = el.dataset.unit;
    var label = el.parentNode.querySelector(".row-label").firstChild.textContent.trim();
    el.innerHTML = '<button type="button" class="minus" aria-label="' + label + ' ' + step + unit + ' 줄이기">&minus;</button>' +
      '<output id="out-' + key + '" aria-live="polite"></output>' +
      '<button type="button" class="plus" aria-label="' + label + ' ' + step + unit + ' 늘리기">+</button>';
    var minus = el.querySelector(".minus"), plus = el.querySelector(".plus"), out = el.querySelector("output");
    function bump(dir) {
      mutate(cur, function (d) { d[key] = Math.max(0, Math.round((d[key] + dir * step) * 10) / 10); });
      fillDaily();
    }
    minus.addEventListener("click", function () { bump(-1); });
    plus.addEventListener("click", function () { bump(1); });
    steppers[key] = function (v) {
      out.innerHTML = fmtNum(v) + "<span>" + unit + "</span>";
      minus.disabled = v <= 0;
    };
  });

  function setSeg(xId, oId, on) {
    $(xId).setAttribute("aria-pressed", String(!on));
    $(oId).setAttribute("aria-pressed", String(!!on));
  }
  function fillDaily() {
    var d = getDay(cur);
    Object.keys(steppers).forEach(function (k) { steppers[k](d[k]); });
    $("coffee-total").textContent = "커피 합계 " + fmtNum(d.coffee + d.decaf) + "잔";
    setSeg("p25-x", "p25-o", d.perfect25);
    setSeg("ot-x", "ot-o", d.overtime);
    $("ot-hours-row").hidden = !d.overtime;
    MEALS.forEach(function (m) {
      var el = $("meal-" + m[0]);
      if (document.activeElement !== el) el.value = d.meals[m[0]];
    });
    ["wake", "sleep"].forEach(function (f) {
      var el = $(f);
      if (document.activeElement !== el) el.value = d[f];
    });
  }

  $("seg-p25").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    mutate(cur, function (d) { d.perfect25 = b.dataset.val === "1"; });
    fillDaily();
  });
  $("seg-ot").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var on = b.dataset.val === "1";
    mutate(cur, function (d) {
      d.overtime = on;
      if (!on) d.overtimeHours = 0; else if (!d.overtimeHours) d.overtimeHours = 1;
    });
    fillDaily();
  });
  MEALS.forEach(function (m) {
    $("meal-" + m[0]).addEventListener("input", function (e) {
      var v = e.target.value; mutate(cur, function (d) { d.meals[m[0]] = v; });
    });
  });
  ["wake", "sleep"].forEach(function (f) {
    $(f).addEventListener("change", function (e) {
      var v = e.target.value; mutate(cur, function (d) { d[f] = v; });
    });
  });

  /* ---------- summaries ---------- */
  function toMin(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function avgTime(list, wrap) {
    var mins = list.map(toMin).filter(function (v) { return v !== null; });
    if (!mins.length) return "–";
    var sum = 0;
    mins.forEach(function (v) { sum += (wrap && v < 720) ? v + 1440 : v; });
    var a = Math.round(sum / mins.length) % 1440;
    return pad(Math.floor(a / 60)) + ":" + pad(a % 60);
  }
  function summarize(keys) {
    var s = { coffee: 0, decaf: 0, water: 0, stairs: 0, steps: 0, runKm: 0, p25: 0, otDays: 0, otHours: 0, wake: [], sleep: [], n: keys.length };
    keys.forEach(function (k) {
      var d = getDay(k);
      s.coffee += d.coffee; s.decaf += d.decaf; s.water += d.water; s.stairs += d.stairs; s.steps += d.steps; s.runKm += d.runKm;
      if (d.perfect25) s.p25++;
      if (d.overtime) { s.otDays++; s.otHours += d.overtimeHours; }
      if (d.wake) s.wake.push(d.wake);
      if (d.sleep) s.sleep.push(d.sleep);
    });
    return s;
  }
  function tile(k, v, unit, sub) {
    return '<div class="tile"><span class="k">' + k + '</span><span class="v">' + v + (unit ? "<span>" + unit + "</span>" : "") +
      '</span>' + (sub ? '<span class="s">' + sub + "</span>" : "") + "</div>";
  }
  function tilesHtml(s) {
    return tile("커피 (카페인)", fmtNum(s.coffee), "잔", "하루 평균 " + fmtNum(s.coffee / s.n) + "잔") +
      tile("디카페인 커피", fmtNum(s.decaf), "잔", "카페인 포함 합계 " + fmtNum(s.coffee + s.decaf) + "잔") +
      tile("물", fmtNum(s.water), "잔", "하루 평균 " + fmtNum(s.water / s.n) + "잔") +
      tile("계단 오르기", fmtNum(s.stairs), "층") +
      tile("걷기", fmtNum(s.steps), "보", "하루 평균 " + fmtNum(Math.round(s.steps / s.n)) + "보") +
      tile("뛰기", fmtNum(s.runKm), "km") +
      tile("Perfect25 수업", s.p25, "회") +
      tile("야근", s.otDays, "일", "총 " + fmtNum(s.otHours) + "시간") +
      tile("평균 일어난 시간", avgTime(s.wake, false), "", "입력한 " + s.wake.length + "일 기준") +
      tile("평균 잠든 시간", avgTime(s.sleep, true), "", "입력한 " + s.sleep.length + "일 기준");
  }
  function z(v, unit) { return v ? fmtNum(v) + (unit || "") : '<span class="zero">–</span>'; }

  /* ---------- weekly view ---------- */
  function weekKeys(k) {
    var d = parseKey(k), off = (d.getDay() + 6) % 7, start = addDays(k, -off), out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(start, i));
    return out;
  }
  function shortDate(k) { var d = parseKey(k); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
  function renderWeekly() {
    var keys = weekKeys(cur), s = summarize(keys);
    $("week-tiles").innerHTML = tilesHtml(s);
    var rows = keys.map(function (k) {
      var d = getDay(k), dt = parseKey(k);
      return '<tr' + (k === today ? ' class="is-today"' : "") + '><td><button type="button" class="daylink" data-go="' + k + '">' +
        dt.getDate() + "일 (" + DOW[dt.getDay()] + ")</button></td>" +
        "<td>" + z(d.coffee) + "</td><td>" + z(d.decaf) + "</td><td>" + z(d.water) + "</td><td>" + z(d.stairs) + "</td><td>" + z(d.steps) + "</td><td>" + z(d.runKm) + "</td>" +
        "<td>" + (d.perfect25 ? '<span class="yes">O</span>' : '<span class="zero">–</span>') + "</td>" +
        "<td>" + (d.overtime ? fmtNum(d.overtimeHours) + "h" : '<span class="zero">–</span>') + "</td>" +
        "<td>" + (d.wake || '<span class="zero">–</span>') + "</td><td>" + (d.sleep || '<span class="zero">–</span>') + "</td></tr>";
    }).join("");
    $("week-table").innerHTML = "<table><thead><tr><th>날짜</th><th>카페인(잔)</th><th>디카페인(잔)</th><th>물(잔)</th><th>계단(층)</th><th>걷기(보)</th><th>뛰기(km)</th><th>P25</th><th>야근</th><th>기상</th><th>취침</th></tr></thead><tbody>" +
      rows + '<tr class="total"><td>합계</td><td>' + fmtNum(s.coffee) + "</td><td>" + fmtNum(s.decaf) + "</td><td>" + fmtNum(s.water) + "</td><td>" + fmtNum(s.stairs) + "</td><td>" + fmtNum(s.steps) +
      "</td><td>" + fmtNum(s.runKm) + "</td><td>" + s.p25 + "회</td><td>" + fmtNum(s.otHours) + "h</td><td>" + avgTime(s.wake, false) +
      "</td><td>" + avgTime(s.sleep, true) + "</td></tr></tbody></table>";
    var meals = keys.map(function (k) {
      var d = getDay(k), lines = MEALS.filter(function (m) { return d.meals[m[0]].trim(); }).map(function (m) {
        return "<span><i>" + m[1] + "</i>" + esc(d.meals[m[0]]) + "</span>";
      });
      if (!lines.length) return "";
      var dt = parseKey(k);
      return '<div class="meal-day"><b>' + shortDate(k) + " (" + DOW[dt.getDay()] + ")</b>" + lines.join("") + "</div>";
    }).join("");
    $("week-meals").innerHTML = meals || '<p class="empty">이번 주에 입력한 식사 기록이 없음.</p>';
  }

  /* ---------- monthly view ---------- */
  function monthKeys(k) {
    var d = parseKey(k), y = d.getFullYear(), m = d.getMonth(), n = new Date(y, m + 1, 0).getDate(), out = [];
    for (var i = 1; i <= n; i++) out.push(keyOf(new Date(y, m, i)));
    return out;
  }
  function renderMonthly() {
    var keys = monthKeys(cur), s = summarize(keys);
    $("month-tiles").innerHTML = tilesHtml(s);
    var html = ["월", "화", "수", "목", "금", "토", "일"].map(function (w) { return '<div class="dow">' + w + "</div>"; }).join("");
    var lead = (parseKey(keys[0]).getDay() + 6) % 7;
    for (var i = 0; i < lead; i++) html += '<div class="cell blank"></div>';
    keys.forEach(function (k) {
      var d = getDay(k), ex = d.stairs || d.steps || d.runKm;
      var has = d.coffee || d.decaf || d.water || ex || d.perfect25 || d.overtime || d.wake || d.sleep ||
        MEALS.some(function (m) { return d.meals[m[0]].trim(); });
      var label = shortDate(k) + ": 커피 " + d.coffee + "잔, 디카페인 " + d.decaf + "잔, 물 " + d.water + "잔" + (ex ? ", 운동" : "") + (d.perfect25 ? ", Perfect25" : "") + (d.overtime ? ", 야근" : "");
      html += '<button type="button" class="cell' + (has ? " has" : "") + (k === today ? " is-today" : "") + '" data-go="' + k + '" aria-label="' + label + '">' +
        '<span class="d">' + parseKey(k).getDate() + '</span><span class="cf">' + (d.decaf ? fmtNum(d.coffee) + "+" + fmtNum(d.decaf) : d.coffee ? fmtNum(d.coffee) : "") + '</span><span class="dots">' +
        (ex ? '<i class="dot ex"></i>' : "") + (d.perfect25 ? '<i class="dot p25"></i>' : "") + (d.overtime ? '<i class="dot ot"></i>' : "") +
        "</span></button>";
    });
    $("cal").innerHTML = html;
  }

  /* ---------- routing & render ---------- */
  function currentView() {
    var h = location.hash.replace("#", "");
    return VIEWS[h] ? h : "daily";
  }
  var renderToken = 0;
  function render() {
    var view = currentView(), token = ++renderToken;
    $("view-name").textContent = VIEWS[view];
    ["daily", "weekly", "monthly"].forEach(function (v) { $("view-" + v).hidden = v !== view; });
    Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function (a) {
      if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var d = parseKey(cur), title, months, atNow;
    if (view === "daily") {
      title = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DOW[d.getDay()] + "요일";
      months = [ymOf(cur)]; atNow = cur === today;
      $("prev").setAttribute("aria-label", "전날"); $("next").setAttribute("aria-label", "다음 날");
    } else if (view === "weekly") {
      var wk = weekKeys(cur);
      title = shortDate(wk[0]) + " – " + shortDate(wk[6]);
      months = [ymOf(wk[0]), ymOf(wk[6])]; atNow = wk.indexOf(today) >= 0;
      $("prev").setAttribute("aria-label", "지난주"); $("next").setAttribute("aria-label", "다음 주");
    } else {
      title = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월";
      months = [ymOf(cur)]; atNow = ymOf(cur) === ymOf(today);
      $("prev").setAttribute("aria-label", "지난달"); $("next").setAttribute("aria-label", "다음 달");
    }
    $("title").textContent = title;
    $("go-today").hidden = atNow;
    $("go-today").textContent = view === "daily" ? "오늘로 이동" : view === "weekly" ? "이번 주로 이동" : "이번 달로 이동";
    if (!ready) return;
    var sec = $("view-" + view);
    function draw() {
      if (token !== renderToken) return;
      sec.classList.remove("loading");
      if (view === "daily") fillDaily(); else if (view === "weekly") renderWeekly(); else renderMonthly();
    }
    var needsLoad = !local && months.some(function (m) { return !loadedMonths[m]; });
    if (needsLoad) { sec.classList.add("loading"); setStatus("불러오는 중"); }
    draw(); // show what is known right away
    if (needsLoad) sec.classList.add("loading");
    ensureMonths(months).then(function () {
      if (token !== renderToken) return;
      $("notice").hidden = true;
      if (needsLoad && !pendingCount) setStatus("저장됨");
      draw();
    }, function () {
      if (token !== renderToken) return;
      setStatus("불러오기 실패", true);
      showNotice("기록을 아직 불러오지 못했음. 연결 상태를 확인한 뒤 다시 시도 필요.", true);
    });
  }

  function shift(dir) {
    var view = currentView();
    if (view === "daily") cur = addDays(cur, dir);
    else if (view === "weekly") cur = addDays(cur, 7 * dir);
    else { var d = parseKey(cur); cur = keyOf(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
    render();
  }
  $("prev").addEventListener("click", function () { shift(-1); });
  $("next").addEventListener("click", function () { shift(1); });
  $("go-today").addEventListener("click", function () { today = keyOf(new Date()); cur = today; render(); });
  $("retry").addEventListener("click", function () { $("notice").hidden = true; render(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]"); if (!b) return;
    cur = b.dataset.go;
    if (currentView() === "daily") render(); else location.hash = "daily";
  });
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  /* ---------- init ---------- */
  function startLocal(msg) {
    local = true; localLoad(); ready = true;
    setStatus("이 기기에 저장");
    showNotice(msg, false);
    render();
  }
  render();
  (async function init() {
    var db = null, user = null, id = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        db = await window.claude.use("db");
        user = await window.claude.use("user");
        if (user) id = await user.id();
      }
    } catch (e) {}
    if (!db || !id) {
      startLocal("계정 저장소에 연결되지 않아 기록이 이 브라우저에만 저장됨. 다른 기기에서는 보이지 않음.");
      return;
    }
    col = db.collection("data/users/" + id);
    ready = true;
    render();
  })();
})();
</script>
</body>
</html>
